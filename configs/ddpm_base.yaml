# Config baseline du processus de diffusion DDPM (cf. PLANNING.md Phase 2).
# Servira aussi de base à l'étude d'ablation sur le nombre de pas
# (configs/ddpm_steps100.yaml, ddpm_steps400.yaml, ddpm_steps1000.yaml...).

timesteps: 1000
schedule: linear   # 'linear' (Ho et al. 2020) ou 'cosine' (Nichol & Dhariwal 2021)
beta_start: 0.0001
beta_end: 0.02
seed: 42

# U-Net de débruitage (src/models/ddpm/unet.py) — petit modèle, pas d'attention,
# pour rester entraînable sur CPU (cf. HISTORY.md, pas de GPU disponible).
model:
  in_channels: 1
  base_channels: 32
  channel_mults: [1, 2, 4]   # résolutions 32 -> 16 -> 8
  num_res_blocks: 2
